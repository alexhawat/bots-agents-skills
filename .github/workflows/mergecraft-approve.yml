# mergeCraft privileged approve — companion to mergecraft.yml (advisory review).
#
# The reviewing agent itself can never submit a real GitHub APPROVE under
# pull_request_target (it reads PR-authored content, so its own verdict can
# never be the thing that unlocks an approval; the default GITHUB_TOKEN is also
# silently downgraded to a comment on any approve attempt).
#
# This SEPARATE workflow never re-reads PR content and never re-invokes the
# agent. It only reads the mergecraft-approval check-run that mergecraft.yml
# already posted (a pure function of Finding severities, immune to the agent's
# narrative) and, only when that conclusion is "success", submits a PAT-backed
# APPROVE.
#
# Why workflow_run: its definition is ALWAYS read from the default branch and
# it runs with no PR checkout at all — real privilege separation.
# `workflow_run.pull_requests` is documented to be empty for fork PRs, so this
# never fires for forks without any manual fork check.
#
# Advisory stance: the review is never a required check; this approval is a
# convenience for PRs whose advisory review came back clean. A human can still
# merge over a non-approved PR. Requires secret MERGECRAFT_REVIEWER_PAT (a
# distinct GitHub identity); when unset the workflow exits quietly.
name: mergecraft-approve

on:
  workflow_run:
    workflows: [mergecraft]
    types: [completed]

permissions:
  contents: read
  checks: read

jobs:
  approve:
    name: mergecraft privileged approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.pull_requests[0] != null
    steps:
      - name: Check the structural mergecraft-approval verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          conclusion=""; queried=""
          for attempt in $(seq 1 3); do
            if conclusion="$(gh api "/repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[]? | select(.name == "mergecraft-approval")]
              | sort_by(.completed_at // .started_at) | last | .conclusion // ""')"; then
              queried="yes"; break
            fi
            echo "check-runs query failed (attempt ${attempt}/3); retrying in 3s…" >&2
            sleep 3
          done
          if [ -z "${queried}" ]; then
            echo "check-runs API unreachable after retries — not approving." >&2
            echo "conclusion=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "mergecraft-approval conclusion for ${HEAD_SHA}: ${conclusion:-none}"
          echo "conclusion=${conclusion}" >> "${GITHUB_OUTPUT}"

      - name: Submit privileged APPROVE
        if: steps.verdict.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.MERGECRAFT_REVIEWER_PAT }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "MERGECRAFT_REVIEWER_PAT not configured — nothing to submit with."
            exit 0
          fi
          # commit_id pins the review to the exact reviewed SHA — GitHub rejects
          # the call if the PR has since moved to a new head, so a stale verdict
          # can never approve a commit it never actually saw.
          gh api "/repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            -X POST \
            -f event=APPROVE \
            -f commit_id="${HEAD_SHA}" \
            -f body="Approved by mergeCraft — clean advisory verdict on ${HEAD_SHA}." \
            >/dev/null
          echo "Submitted PAT-backed APPROVE for PR #${PR_NUMBER} @ ${HEAD_SHA}."
